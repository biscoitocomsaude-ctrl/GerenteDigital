<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Gerente Digital</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="app">

    <!--==============================
        Cabeçalho
    ==============================-->

    <header class="topo">

        <h1>🤖 Gerente Digital</h1>

        <span class="status">

            ● Sistema Online

        </span>

    </header>



    <!--==============================
        Conversa
    ==============================-->

    <main
        id="resposta"
        class="chat">

        <div class="mensagem sistema">

            <strong>Gerente Digital</strong>

            <br><br>

            Olá!

            <br><br>

            Estou pronto para registrar informações
            na sua planilha.

        </div>

    </main>



    <!--==============================
        Área de Digitação
    ==============================-->

    <footer class="entrada">

        <textarea

            id="pergunta"

            placeholder="Digite uma informação..."

        ></textarea>



        <div class="acoes">

            <button

                id="microfone"

                title="Microfone">

                🎤

            </button>



            <button

                id="enviar">

                Enviar

            </button>

        </div>

    </footer>

</div>



<script src="config.js"></script>

<script src="app.js"></script>

</body>

</html>
